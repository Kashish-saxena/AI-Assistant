flows:
  pattern_chitchat:
    description: Conversation repair flow for off-topic interactions that won't disrupt the main conversation. should not respond to greetings or anything else for which there is a flow defined
    name: pattern chitchat
    steps:
      - action: utter_free_chitchat_response
  pattern_search:
    description: Flow for handling knowledge-based questions — should NOT respond to greetings or other defined intents
    name: pattern search
    steps:
      - action: utter_free_chitchat_response
  pattern_license_info:
    description: Handle user queries related to license information
    name: pattern license info
    steps:
      - action: user_information