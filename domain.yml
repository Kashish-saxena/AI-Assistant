version: "3.1"

entities:
  - email
  - first_name
  - location
  - phone_number

actions:
  - action_validate_email_format
  - action_validate_phone_number_format

slots:
  first_name:
    type: text
    mappings:
      - type: from_llm
  location:
    type: text
    mappings:
      - type: from_llm
  email:
    type: text
    mappings:
      - type: from_llm
  phone_number:
    type: text
    mappings:
      - type: from_llm
  email_validated:
    type: bool
  phone_number_validated:
    type: bool
  newEmail:   
    type: text
    mappings:
      - type: from_llm


responses:
  utter_ask_first_name:
    - text: "I'd love to know who I'm chatting with today—what's your name?"
      metadata:
        rephrase: True
  utter_ask_last_name:
    - text: "Great to meet you! Could I get your last name as well?"
    - text: "Wonderful! What's your last name?"
      metadata:
        rephrase: True
  
  utter_ask_location:
    - text: "And which city do you call home these days?"
      metadata:
        rephrase: True
  
  utter_ask_email:
    - text: "I'd like to keep you updated on your license application—what's your email address?"
      metadata:
        rephrase: True
  
  utter_ask_phone_number:
    - text: "Just in case we need to reach you about your license, what's your phone number?"
      metadata:
        rephrase: True
  
  utter_random_stuff_response:
    - text: "I see you're asking about something else! Let me know if you'd like to talk about anything specific. By the way, I still need to know where you're based."
    
  utter_user_info_received: 
    - text: "Perfect! I've got all your details saved. We'll be in touch soon about your license application. Is there anything else you'd like to know in the meantime?"
      metadata:
        rephrase: True

  utter_purpose_user_info: 
    - text: "To help you with your license, I'll need just a few quick details from you: your name, where you're located, and how we can contact you."
      metadata:
        rephrase: True  

  utter_greet: 
    - text: "Hi there! Welcome to our license application assistant. How can I help you today?"
    - text: "Hello! I'm here to help with your license application. What brings you here today?"
      metadata:
        rephrase: True

  utter_valid_email:
    - text: "Thanks for providing a valid email address!"
      metadata:
        rephrase: True

  utter_ask_newEmail:
    - text: "Hmm, that email address doesn't seem quite right. Could you check the format and try again? We need this to send you important information about your license."
      metadata:
        rephrase: True

  utter_invalid_email_format:
    - text: "Hmm, that email address doesn't seem quite right. Could you check the format and try again? We need this to send you important information about your license."
      metadata:
        rephrase: True

  utter_invalid_phone_number_format:
    - text: "Hmm, that phone number doesn't seem quite right. Could you check the format and try again? We need this to send you important information about your license."
      metadata:
        rephrase: True

  utter_show_user_details:
    - text: "Here's the information I have so far:\n• Name: {first_name} {last_name}\n• Location: {location}\n• Email: {email}\n• Phone: {phone_number}\n\nIs all of this correct?"
      metadata:
        rephrase: True

  utter_free_chitchat_response:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          The following is a conversation with an AI assistant built with Rasa.
          The assistant helps users complete their license application process.
          The assistant is friendly, helpful, and conversational.
          The assistant naturally collects user information while maintaining a warm, supportive tone.
          Context / previous conversation with the user:
          {{history}}
          {{current_input}}
          Suggested AI Response:
