version: "3.1"

entities:
  - email

actions:
  - action_validate_email_format

slots:
  first_name:
    type: text
    mappings:
      - type: from_llm
  last_name:
    type: text
    mappings:
      - type: from_llm
  location:
    type: text
    mappings:
      - type: from_llm
  email:
    type: text
    mappings:
      - type: from_text
        influence_conversation: true
  email_validated:
    type: bool

responses:
  utter_ask_first_name:
    - text: "Can I know your first name?"
      metadata:
        rephrase: True
  utter_ask_last_name:
    - text: "Can I know your last name?"
      metadata:
        rephrase: True
  utter_ask_location:
    - text: "Where do you belong from?"
      metadata:
        rephrase: True
  utter_ask_email:
    - text: "Can I know your email"
      metadata:
        rephrase: True
  utter_user_info_received: 
    - text: "Great! Your details has been successfully stored."
  utter_purpose_user_info: 
    - text: "To proceed with the licensing, we'll need a few details from you: your first name, last name, location, and email address."
  utter_greet: 
    - text: "Hi there!"
  utter_valid_email:
    - text: "Please provide a valid email."
  utter_invalid_email_format:
    - text: "Oops! That doesn't look like a valid email. Could you try again?"
  utter_show_user_details:
    - text: "Here's what you've entered:\nFirst name: {first_name}\nLast name: {last_name}\nLocation: {location}\nEmail: {email}"
      metadata:
        rephrase: True
