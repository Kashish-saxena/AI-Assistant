version: "3.1"

intents: 
  - provide_user_info
  - fetch_user_details
  - ask_license_info
  - greet
  - affirm
  - deny
  - interrupt_with_new_flow
  - update_user_info
  - user_information_with_query
  # - specify_license_type

entities:
  - email
  - name
  - location
  - phone_number
  - license_type

slots:
  name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: name
      - type: from_llm

  location:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: location
      - type: from_llm

  email:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: email
      - type: from_llm

  phone_number:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: phone_number
      - type: from_llm

  interrupted_flow:
    type: text
    mappings:
    - type: controlled  
      conditions:
      - active_loop: null

  location_acknowledged:
    type: bool
    influence_conversation: false

forms:
  user_information:
    required_slots:
      - name
      - location
      - phone_number
      - email

responses:
  utter_greet_and_license_info:
    - text: "greet and then guide the user properly about the license  and it's need"
      metadata:
        rephrase: True  

  utter_ask_name:
    - text: "I'd love to personalize your licensing assistance—may I know your name?"
      metadata:
        rephrase: True

  utter_ask_location:
    - text: "To guide you better with the licensing steps, which city are you currently based in?"
      metadata:
        rephrase: True

  utter_ask_email:
    - text: "To make sure you receive all important updates about your license application, could you share your email address?"
      metadata:
        rephrase: True

  utter_ask_phone_number:
    - text: "To keep you updated about your licensing process and any important steps, could you please share your phone number?"
      metadata:
        rephrase: True

  utter_random_stuff_response:
    - text: "I see you're asking about something else! Let me know if you'd like to talk about anything specific. By the way, I still need to know where you're based."

  utter_user_info_received: 
    - text: "Perfect! I've got all your details saved. We'll be in touch soon about your license application. Is there anything else you'd like to know in the meantime?"
      metadata:
        rephrase: True


  utter_invalid_email:
    - text: "Hmm, that email address doesn't seem quite right."
      metadata:
        rephrase: True

  utter_invalid_phone_number:
    - text: "Hmm, that phone number doesn't seem quite right."
      metadata:
        rephrase: True

  utter_show_user_details:
    - text: |
        Here's the information I have so far:
        • Name: {name}
        • Location: {location}
        • Email: {email}
        • Phone: {phone_number}
        
        Is all of this correct?
      metadata:
        rephrase: True

  utter_acknowledge_more_questions:
    - text: "Alright! Feel free to ask any other questions. I'm here to help."

  utter_location_confirmation:
    - text: "So you're from {location}."
      metadata:
        rephrase: true

  utter_free_chitchat_response:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          The following is a conversation with an AI assistant built with Rasa.
          The assistant helps users complete their license application process.
          The assistant is friendly, helpful, and conversational.
          The assistant naturally collects user information while maintaining a warm, supportive tone.
          Context / previous conversation with the user:
          {{history}}
          Suggested AI Response:
    
  utter_license_info_with_ollama:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          You are an AI assistant specialized in helping people understand the licensing procedures in countries.
          You are helpful, clear, and friendly. Based on the conversation so far, guide the user on what steps or procedures to take before applying for a licence.
          Context / previous conversation with the user:
          {{history}}
          Suggested AI Response:

actions:
  - action_update_user_info
  - action_check_all_user_info_slots_filled
  - action_complete_new_flow_and_resume
  - action_check_location_and_trigger_flow
  - action_extract_multiple_slots
  - action_check_slot_filled
  - action_fetch_user_details
  - action_rephrased_license_info
  - action_new_extract_multiple_slots
  - action_interrupt_and_start_new_flow
  - action_activate_new_flow